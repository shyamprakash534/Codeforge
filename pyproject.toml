[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeforge"
version = "0.1.0"
description = "Security-conscious coding-agent foundation"
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.scripts]
codeforge = "codeforge.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
