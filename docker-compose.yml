services:
  codeforge:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      CODEFORGE_LLM_PROVIDER: ${CODEFORGE_LLM_PROVIDER:-local}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      CODEFORGE_MODEL: ${CODEFORGE_MODEL:-qwen2.5-coder:7b}
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
volumes:
  ollama_data:
